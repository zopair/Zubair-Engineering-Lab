name: Portfolio Sample 04 — Batch File Automation

on:
  push:
    paths:
      - 'portfolio/04-batch-file-automation/**'
      - '.github/workflows/portfolio-sample-04.yml'
  pull_request:
    paths:
      - 'portfolio/04-batch-file-automation/**'
      - '.github/workflows/portfolio-sample-04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run batch automation acceptance tests
        working-directory: portfolio/04-batch-file-automation
        run: python -m unittest discover -s tests -v
