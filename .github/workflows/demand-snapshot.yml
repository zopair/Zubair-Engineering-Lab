name: Demand snapshot validation

on:
  push:
    paths:
      - "research/upwork-demand/**"
      - "scripts/validate_demand_snapshot.py"
      - "tests/test_demand_snapshot.py"
      - ".github/workflows/demand-snapshot.yml"
  pull_request:
    paths:
      - "research/upwork-demand/**"
      - "scripts/validate_demand_snapshot.py"
      - "tests/test_demand_snapshot.py"
      - ".github/workflows/demand-snapshot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate snapshot
        run: python scripts/validate_demand_snapshot.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_demand_snapshot.py" -v
