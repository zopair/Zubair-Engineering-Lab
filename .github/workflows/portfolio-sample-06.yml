name: Portfolio Sample 06 — PDF Extraction

on:
  push:
    paths:
      - 'portfolio/06-pdf-extraction/**'
      - '.github/workflows/portfolio-sample-06.yml'
  pull_request:
    paths:
      - 'portfolio/06-pdf-extraction/**'
      - '.github/workflows/portfolio-sample-06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portfolio/06-pdf-extraction/requirements.txt
      - name: Install dependencies
        working-directory: portfolio/06-pdf-extraction
        run: python -m pip install -r requirements.txt
      - name: Run PDF extraction acceptance tests
        working-directory: portfolio/06-pdf-extraction
        run: python -m unittest discover -s tests -v
