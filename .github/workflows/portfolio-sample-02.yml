name: Portfolio Sample 02 — Spreadsheet Cleanup

on:
  push:
    paths:
      - 'portfolio/02-spreadsheet-cleanup/**'
      - '.github/workflows/portfolio-sample-02.yml'
  pull_request:
    paths:
      - 'portfolio/02-spreadsheet-cleanup/**'
      - '.github/workflows/portfolio-sample-02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spreadsheet dependencies
        run: python -m pip install -r portfolio/02-spreadsheet-cleanup/requirements.txt
      - name: Run spreadsheet acceptance tests
        working-directory: portfolio/02-spreadsheet-cleanup
        run: python -m unittest discover -s tests -v