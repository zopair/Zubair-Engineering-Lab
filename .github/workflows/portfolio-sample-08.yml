name: Portfolio Sample 08 — Bilingual RTL Landing Page

on:
  push:
    paths:
      - 'portfolio/08-bilingual-rtl-landing/**'
      - '.github/workflows/portfolio-sample-08.yml'
  pull_request:
    paths:
      - 'portfolio/08-bilingual-rtl-landing/**'
      - '.github/workflows/portfolio-sample-08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bilingual landing page acceptance tests
        working-directory: portfolio/08-bilingual-rtl-landing
        run: python -m unittest discover -s tests -v
