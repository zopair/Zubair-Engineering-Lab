name: Portfolio Sample 05 — REST API Integration

on:
  push:
    paths:
      - 'portfolio/05-rest-api-integration/**'
      - '.github/workflows/portfolio-sample-05.yml'
  pull_request:
    paths:
      - 'portfolio/05-rest-api-integration/**'
      - '.github/workflows/portfolio-sample-05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portfolio/05-rest-api-integration/requirements.txt
      - name: Install dependencies
        working-directory: portfolio/05-rest-api-integration
        run: python -m pip install -r requirements.txt
      - name: Run REST API acceptance tests
        working-directory: portfolio/05-rest-api-integration
        run: python -m unittest discover -s tests -v
